name: TestFlight

# 手動実行（Actions タブ → TestFlight → Run workflow）または v1.0.0 のようなタグを push したときに実行。
# 必要な Secrets: ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8（App Store Connect API キー、Admin 権限）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TEAM_ID: H838Y2V34C

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error title=Secrets::未設定:$missing"
            exit 1
          fi
          echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY" || { echo "::error title=Secrets::ASC_KEY_P8 に BEGIN PRIVATE KEY の行が含まれていません"; exit 1; }

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Archive (Release)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # ビルド番号は実行ごとに増える番号を使う（App Store Connect では重複不可）
          BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project SuginamiArtWalk.xcodeproj \
            -scheme SuginamiArtWalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SuginamiArtWalk.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log || {
            report() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            ERRS=$(grep -iE "error|fail|signing|provision|certificate" archive.log | grep -v "^ *export\|^ *cd " | sort -u | tail -25 | cut -c1-300 | report)
            TAIL=$(tail -30 archive.log | cut -c1-300 | report)
            echo "::error title=Archive errors::${ERRS:-（該当行なし）}"
            echo "::error title=Archive log tail::${TAIL}"
            exit 1
          }

      - name: Export & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SuginamiArtWalk.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | tail -40
          if grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log; then
            echo "::notice title=TestFlight::ビルド ${BUILD_NUMBER} を App Store Connect にアップロードしました（処理完了まで10〜30分ほどかかります）"
          else
            report() { sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error title=Export errors::$(grep -iE "error|fail" export.log | sort -u | tail -25 | cut -c1-300 | report)"
            echo "::error title=Export log tail::$(tail -30 export.log | cut -c1-300 | report)"
            exit 1
          fi

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
