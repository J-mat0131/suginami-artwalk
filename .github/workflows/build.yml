name: Build (Simulator)

on:
  push:
    branches: [main]
    # データ・ドキュメント・定期チェックだけの変更ではアプリをビルドしない
    paths-ignore:
      - 'docs/**'
      - 'monitor/**'
      - 'tools/**'
      - '**.md'
      - '.github/workflows/check-official.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SuginamiArtWalk.xcodeproj \
            -scheme SuginamiArtWalk \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Verify app bundle
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/SuginamiArtWalk.app
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          NAME=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")
          ICON=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$APP/Info.plist" 2>/dev/null || echo "なし")
          ICONFILES=$(ls "$APP" | grep -c '^AppIcon' || true)
          WARN=$(grep -c ' warning: ' build.log || true)
          echo "::notice title=App bundle::id=$BID name=$NAME icon=$ICON iconFiles=$ICONFILES warnings=$WARN"
          grep ' warning: ' build.log | sort -u | head -10 | while read -r l; do echo "::warning title=Swift::${l##*/}"; done
          [ "$ICON" = "AppIcon" ] || { echo "::error::AppIcon が組み込まれていません"; exit 1; }
          BG=$(plutil -extract UIBackgroundModes json -o - "$APP/Info.plist" 2>/dev/null || echo "なし")
          KEYS=""
          for k in NSLocationWhenInUseUsageDescription NSMotionUsageDescription NSCameraUsageDescription NSPhotoLibraryAddUsageDescription; do
            plutil -extract $k raw "$APP/Info.plist" >/dev/null 2>&1 && KEYS="$KEYS $k=ok" || { echo "::error::$k がありません"; exit 1; }
          done
          echo "::notice title=Info.plist::UIBackgroundModes=$BG$KEYS"
          echo "$BG" | grep -q location || { echo "::error::UIBackgroundModes に location がありません"; exit 1; }
          [ -f "$APP/content.json" ] || { echo "::error::content.json が同梱されていません"; exit 1; }

      - name: Zip .app for Appetize
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/SuginamiArtWalk-simulator.zip" SuginamiArtWalk.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuginamiArtWalk-simulator
          path: SuginamiArtWalk-simulator.zip
          retention-days: 14

      # 任意: リポジトリの Secrets に APPETIZE_API_TOKEN（と既存アプリを更新する場合は
      # Variables に APPETIZE_PUBLIC_KEY）を設定すると、Appetize へ自動アップロードする。
      - name: Upload to Appetize
        if: github.event_name != 'pull_request'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY || 'wlxn5sn3ovsnckupreevii7tpm' }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "::warning title=Appetize::APPETIZE_API_TOKEN が未設定のためアップロードをスキップしました"
            exit 0
          fi
          URL="https://api.appetize.io/v1/apps"
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then URL="$URL/$APPETIZE_PUBLIC_KEY"; fi
          STATUS=$(curl -sS -o appetize.json -w '%{http_code}' -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@SuginamiArtWalk-simulator.zip" \
            -F "platform=ios")
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error title=Appetize::アップロード失敗 HTTP $STATUS: $(head -c 300 appetize.json | tr '\n' ' ')"
            exit 1
          fi
          KEY=$(grep -o '"publicKey" *: *"[^"]*"' appetize.json | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "::notice title=Appetize::Uploaded https://appetize.io/app/$KEY"
          echo "### Appetize: https://appetize.io/app/$KEY" >> "$GITHUB_STEP_SUMMARY"
