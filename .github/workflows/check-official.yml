name: Official site check

# 毎週月曜 9:17（日本時間）に区の公式ページとノベルティ配布場所PDFを確認する。
# 変化があれば Issue で通知、なければアプリのデータの「最終確認日」を更新する。
on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: check-official
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Check official pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_official.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor docs/data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "公式サイトの定期チェック（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
            git push
          fi
