<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すぎなみアートウオークアプリ(非公式)</title>
<style>
  :root { color-scheme: light dark; --accent: #347F8C; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.8; margin: 0; padding: 32px 16px; background: #E6F4F6; color: #1d2b2e; }
  @media (prefers-color-scheme: dark) { body { background: #142226; color: #e6f0f2; } :root { --accent: #7FCBD3; } }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; }
  a { color: var(--accent); }
  .note { font-size: .9rem; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>すぎなみアートウオークアプリ(非公式)</h1>
  <p>杉並区「すぎなみアートウオーク」（2026年10月1日〜2027年3月21日）のアートサイン7か所を巡るための、個人が開発した非公式のiPhoneアプリです。杉並区とは関係ありません。</p>
  <p>イベントの最新情報は<a href="https://www.city.suginami.tokyo.jp/s092/event/27274.html">杉並区公式ページ</a>をご確認ください。</p>
  <p class="note">このサイトはアプリが表示する情報（ノベルティ配布場所など）の配信にも使っています。</p>
</main>
</body>
</html>
