<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#BFE8EC"/>
      <stop offset="0.55" stop-color="#86CCD5"/>
      <stop offset="1" stop-color="#5FADBE"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9A8E8"/>
      <stop offset="1" stop-color="#8E9FD6"/>
    </linearGradient>
    <clipPath id="hole"><circle cx="512" cy="420" r="172"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- soft cloud band -->
  <g fill="#FFFFFF" opacity="0.42">
    <circle cx="40" cy="1000" r="120"/><circle cx="170" cy="960" r="110"/><circle cx="300" cy="1010" r="120"/>
    <circle cx="720" cy="1010" r="120"/><circle cx="850" cy="955" r="115"/><circle cx="990" cy="990" r="125"/>
    <rect x="0" y="1000" width="1024" height="24"/>
  </g>
  <!-- sparkles -->
  <path d="M190 210 l14 36 36 14 -36 14 -14 36 -14 -36 -36 -14 36 -14z" fill="#FBE299"/>
  <path d="M845 330 l9 23 23 9 -23 9 -9 23 -9 -23 -23 -9 23 -9z" fill="#FFFFFF"/>
  <!-- pin shadow -->
  <ellipse cx="512" cy="912" rx="130" ry="24" fill="#2E7685" opacity="0.30"/>
  <!-- pin -->
  <path d="M512 905 L287.6 570.2 A270 270 0 1 1 736.4 570.2 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
  <!-- canvas inside pin -->
  <circle cx="512" cy="420" r="172" fill="url(#canvas)"/>
  <g clip-path="url(#hole)">
    <circle cx="452" cy="322" r="11" fill="#FBE299"/>
    <circle cx="560" cy="298" r="7" fill="#FFFFFF"/>
    <circle cx="414" cy="405" r="6" fill="#FFFFFF"/>
    <path d="M360 545 Q 470 420 610 372" fill="none" stroke="#62B589" stroke-width="78" stroke-linecap="round"/>
    <path d="M330 600 Q 470 520 680 520" fill="none" stroke="#7FCBD3" stroke-width="64" stroke-linecap="round"/>
  </g>
  <!-- paintbrush -->
  <g transform="translate(600 378) rotate(-45) scale(1.35)">
    <path d="M150 -25 L268 -16 Q 290 0 268 16 L150 25 Z" fill="#7E6DB4" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
    <rect x="92" y="-31" width="62" height="62" rx="8" fill="#E3E6EE" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M-6 0 Q 36 -34 96 -27 L96 27 Q 36 34 -6 0 Z" fill="#62B589" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
