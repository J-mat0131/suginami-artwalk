name: SuginamiArtWalk
options:
  bundleIdPrefix: io.github.jmat0131
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SuginamiArtWalk:
    type: application
    platform: iOS
    sources:
      - SuginamiArtWalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jmat0131.suginami-artwalk
        DEVELOPMENT_TEAM: H838Y2V34C
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 独自の暗号化を使っていないため輸出コンプライアンスの質問を省略
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ホーム画面のアイコン下に出る名前（長いと「…」で省略されるため短く）
        # App Store上の名前「すぎなみアートウオークアプリ(非公式)」は App Store Connect で設定する
        INFOPLIST_KEY_CFBundleDisplayName: "アートウオーク"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "近くのアートサインを知らせ、到着を確認するために現在地を使います。位置情報は端末の外に送信されません。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
