name: SuginamiArtWalk
options:
  bundleIdPrefix: io.github.jmat0131
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SuginamiArtWalk:
    type: application
    platform: iOS
    sources:
      - SuginamiArtWalk
      # GitHub Pages で配信するデータの初期版をアプリにも同梱（オフライン時の予備）
      - path: docs/data/v1/content.json
        buildPhase: resources
    # 自動生成の Info.plist 項目に加えて、配列が必要な項目だけここで指定する
    info:
      path: SuginamiArtWalk/Info.plist
      properties:
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jmat0131.suginami-artwalk
        DEVELOPMENT_TEAM: H838Y2V34C
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 独自の暗号化を使っていないため輸出コンプライアンスの質問を省略
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ホーム画面のアイコン下に出る名前（長いと「…」で省略されるため短く）
        # App Store上の名前「すぎなみアートウォークアプリ(非公式)」は App Store Connect で設定する
        INFOPLIST_KEY_CFBundleDisplayName: "アートウォーク"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "近くのアートサインを知らせ、到着を確認するため、また「スタート」後に歩いた道のりを記録するために現在地を使います。位置情報は端末の外に送信されません。"
        INFOPLIST_KEY_NSCameraUsageDescription: "アートサインを鑑賞した記念に写真を撮るためにカメラを使います。撮った写真はこのアプリの中と、設定に応じて「写真」アプリに保存されます。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "アプリで撮った記念の写真を、「写真」アプリにも保存するために使います。"
        INFOPLIST_KEY_NSMotionUsageDescription: "歩いた記録に歩数を表示するために、iPhoneの歩数計を使います。データは端末の外に送信されません。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
